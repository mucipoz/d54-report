name: D54 fork PR comment
on:
  workflow_run:
    workflows: ["D54 Report"]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo,run_id:run.id,per_page:100})
            const match = jobs.find(j => j.conclusion === 'success' && /^D54 counts \[(\d+,){4}\d+\]$/.test(j.name))
            if (!match) return
            const n = JSON.parse(match.name.slice('D54 counts '.length))
            if (!n.every(v => Number.isSafeInteger(v) && v >= 0) || n[4] > 100) return
            const prs = await github.paginate(github.rest.pulls.list, {...context.repo,state:'open',head:run.head_repository.owner.login + ':' + run.head_branch,per_page:100})
            const pr = prs.find(p => p.head.repo?.id === run.head_repository.id && p.head.sha === run.head_sha)
            if (!pr) return
            const marker = '<!-- d54-report -->'
            const body = [marker,'## D54 Report','','| Critical | High | Medium | Low | Health |','| ---: | ---: | ---: | ---: | ---: |',`| ${n[0]} | ${n[1]} | ${n[2]} | ${n[3]} | ${n[4]}/100 |`].join('\n')
            const args = {...context.repo,issue_number:pr.number}
            const comments = await github.paginate(github.rest.issues.listComments,{...args,per_page:100})
            const prev = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker))
            if (prev) await github.rest.issues.updateComment({...context.repo,comment_id:prev.id,body})
            else await github.rest.issues.createComment({...args,body})
